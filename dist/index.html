<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <meta
      name="description"
      content="用于批量整理图片和商品资料的 TEMU 全托管发布页面。"
    />
    <title>TEMU 商品发布助手</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23101820'/%3E%3Cpath d='M13 17h38v10H37v24H27V27H13z' fill='%23f6a800'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css?v=20261008-8" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.10.1/cloudbase.full.js" defer></script>
    <script src="./config.js?v=20261008-8" defer></script>
    <script src="./app.js?v=20261008-8" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">T</div>
          <div>
            <strong>TEMU 全托管发布</strong>
            <span>商品批量发布</span>
          </div>
          <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="关闭导航">
            <i data-lucide="x"></i>
          </button>
        </div>

        <nav class="nav-list" aria-label="主导航">
          <button class="nav-item active" data-view="publish">
            <i data-lucide="package-plus"></i><span>发布商品</span>
          </button>
        </nav>

        <div class="sidebar-foot">
          <div class="connection-line">
            <span class="status-dot warning"></span>
            <div><strong>正在连接云端</strong><span>正在检查妙手接口</span></div>
          </div>
          <small class="credential-state">App ID / Key 已由后端绑定</small>
        </div>
      </aside>

      <div class="mobile-backdrop" id="mobileBackdrop"></div>

      <main class="main-area">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开导航">
            <i data-lucide="menu"></i>
          </button>
          <div class="page-heading">
            <h1 id="pageTitle">发布商品</h1>
            <p id="pageSubtitle">TEMU 全托管商品批量发布</p>
          </div>
          <span class="managed-badge"><i data-lucide="store"></i>TEMU 全托管</span>
        </header>

        <div class="workspace">
          <section class="view active" id="view-publish">
            <section class="panel-section" id="source">
              <div class="import-grid">
                <label class="drop-zone" id="sheetDrop">
                  <input type="file" id="sheetInput" accept=".xlsx,.xls,.csv" />
                  <span class="drop-icon"><i data-lucide="sheet"></i></span>
                  <strong>选择商品表格</strong>
                  <span>支持 XLSX、XLS、CSV</span>
                  <small id="sheetFileName">尚未选择文件</small>
                </label>
                <label class="drop-zone" id="imageDrop">
                  <input type="file" id="imageInput" accept="image/*" multiple webkitdirectory directory />
                  <span class="drop-icon amber"><i data-lucide="images"></i></span>
                  <strong>选择商品图片文件夹</strong>
                  <span>文件名必须为 1.1、1.2 … N.6</span>
                  <small id="imageFileName">选择后自动检查图片编号</small>
                </label>
              </div>
            </section>

            <section class="panel-section" id="channel">
              <span id="erpSyncState" hidden></span>
              <div class="erp-select-grid">
                <div class="erp-select-column">
                  <span class="erp-field-icon"><i data-lucide="store"></i></span>
                  <div class="field">
                  <label for="storeSelect">目标店铺</label>
                  <select id="storeSelect" disabled><option value="">正在读取 ERP…</option></select>
                  </div>
                  <small>已绑定店铺</small>
                </div>
                <div class="erp-select-column">
                  <span class="erp-field-icon product"><i data-lucide="layout-template"></i></span>
                  <div class="field">
                    <label for="productTemplateSelect">产品模板</label>
                    <select id="productTemplateSelect" disabled><option value="">需要妙手网页登录同步</option></select>
                  </div>
                  <small>标题规则、描述、类目、轮播图位置</small>
                </div>
                <div class="erp-select-column">
                  <span class="erp-field-icon sku"><i data-lucide="scan-barcode"></i></span>
                  <div class="field">
                    <label for="skuTemplateSelect">SKU 模板</label>
                    <select id="skuTemplateSelect" disabled><option value="">需要妙手网页登录同步</option></select>
                  </div>
                  <small>SKU 编码、规格、价格和库存</small>
                </div>
              </div>
              <div class="erp-source-note">
                <button class="text-btn" id="refreshERP">重新读取 ERP</button>
              </div>
            </section>

            <section class="panel-section" id="review">
              <div class="section-title table-heading">
                <div><h2>商品匹配结果</h2><p id="matchSummary"><span id="selectedCount">5</span> 个产品：5 个 Excel 标题，5 组轮播图，每组 6 张。</p></div>
                <div class="toolbar">
                  <div class="search-box"><i data-lucide="search"></i><input id="productSearch" placeholder="搜索货号或标题" /></div>
                  <button class="icon-btn" id="filterBtn" aria-label="筛选商品" title="筛选"><i data-lucide="list-filter"></i></button>
                </div>
              </div>
              <div class="table-wrap">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th class="check-cell"><input id="selectAll" type="checkbox" checked aria-label="全选商品" /></th>
                      <th>产品标题（Excel）</th><th>轮播图</th><th>预览图</th><th>SKU 模板</th><th>检查结果</th><th></th>
                    </tr>
                  </thead>
                  <tbody id="productRows"></tbody>
                </table>
              </div>
            </section>

            <section class="submit-bar" id="submit">
              <div class="submit-status">
                <span class="status-dot warning" id="submitStatusDot"></span>
                <p><strong id="submitStatusTitle">等待选择完整资料</strong><small id="submitStatusText">整个文件夹全部上传并校验成功后，才会继续发布商品。</small></p>
                <div class="upload-progress" id="uploadProgress" hidden>
                  <div class="progress-track"><span id="uploadProgressBar" style="width:0%"></span></div>
                  <small id="uploadProgressText">0 / 0</small>
                </div>
              </div>
              <div class="submit-actions">
                <button class="btn secondary" id="queueBtn"><i data-lucide="list-plus"></i>加入未发布</button>
                <button class="btn primary" id="publishBtn"><i data-lucide="send"></i>直接发布</button>
              </div>
            </section>
          </section>

        </div>
      </main>
    </div>

    <div class="dialog-backdrop" id="dialogBackdrop" aria-hidden="true">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <div class="dialog-head"><div><h3 id="dialogTitle">批量修改商品</h3><p id="dialogSubtitle">修改将应用到当前选中的商品。</p></div><button class="icon-btn" id="dialogClose" aria-label="关闭"><i data-lucide="x"></i></button></div>
        <div class="dialog-body" id="dialogBody"></div>
        <div class="dialog-actions"><button class="btn secondary" id="dialogCancel">取消</button><button class="btn primary" id="dialogConfirm">确认</button></div>
      </div>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  </body>
</html>
